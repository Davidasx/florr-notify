[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "florr-notify"
version = "0.1.0"
description = "Local Discord monitor for florr.io Super mob spawns and kills"
requires-python = ">=3.10"
dependencies = [
    "discord.py-self>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
florr-notify = "florr_notify.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
